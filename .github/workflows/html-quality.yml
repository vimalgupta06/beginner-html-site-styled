name: HTML Quality Check

on:
  push:
    branches: [main, practice/html-quality-check]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  html-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run lint:html